<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>CFA Business</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0B1F3A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--n:#0B1F3A;--g:#15803D;--bg:#F3F5F8;--c:#fff;--t:#14213A;--m:#5B6882;--bd:#DDE3EC;--r:#C62828;--o:#B45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0A1424;--c:#12213A;--t:#EAF0FA;--m:#93A1BB;--bd:#243656;--g:#34C46B;--r:#F97066;--o:#FDB022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--n);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}header b{font-size:20px;letter-spacing:.2px}header small{display:block;color:#A9B8D3;font-size:12px}
main{padding:14px;max-width:720px;margin:auto}h2{margin:4px 0 12px;font-size:22px}h3{margin:0 0 8px}
.demo{background:#FEF3C7;color:#78350F;padding:8px 14px;font-size:14px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k small{color:var(--m);font-size:13px;display:block}.k b{font-size:19px}.k.g b{color:var(--g)}.k.r b{color:var(--r)}.k.big{grid-column:1/-1;background:var(--n);color:#fff;border:0}.k.big small{color:#A9B8D3}.k.big b{font-size:26px;color:#fff}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.chip{border:1px solid var(--bd);background:var(--c);color:var(--t);border-radius:99px;padding:9px 14px;font-size:15px;white-space:nowrap}.chip.on{background:var(--n);color:#fff;border-color:var(--n)}
button{font:inherit;cursor:pointer}.b,.b2,.bs{min-height:46px;border-radius:10px;padding:0 16px;border:0;font-weight:600}.b{background:var(--g);color:#fff}.b2{background:transparent;border:1px solid var(--bd);color:var(--t)}.bs{min-height:40px;padding:0 12px;font-size:14px;background:transparent;border:1px solid var(--bd);color:var(--t)}.bs.w{color:var(--g);border-color:var(--g)}.bs.d{color:var(--r);border-color:var(--r)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;background:var(--c);color:var(--t)}label{display:block;font-size:14px;color:var(--m);margin:10px 0 4px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-left:4px}.ok{color:var(--g)}.ko{color:var(--r)}.wa{color:var(--o)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.mut{color:var(--m);font-size:14px}.empty{text-align:center;color:var(--m);padding:28px 12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--m);font-size:11px;min-height:58px}nav button span{display:block;font-size:20px}nav button.on{color:var(--g);font-weight:700}
#m{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}#m.on{display:flex}#mb{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.it{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;gap:6px}.r2{display:grid;grid-template-columns:1fr 1.5fr 46px;gap:6px}.x{border:0;background:none;color:var(--r);font-size:24px}
.err{color:var(--r);font-size:14px;font-weight:600}.tot{font-weight:700;margin-top:10px}#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:10;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}.sc{overflow-x:auto}
</style></head><body>
<header><svg width="38" height="38" viewBox="0 0 38 38"><rect width="38" height="38" rx="9" fill="#15803D"/><path d="M8 27V21M15 27V16M22 27V19M29 27V10" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><div><b>CFA Business</b><small>Tes commandes, ton argent, tout sous contrôle.</small></div></header>
<div id="demo"></div><main id="app"></main><nav id="nav"></nav><div id="m"><div id="mb"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={XOF:'F CFA',XAF:'F CFA',GNF:'GNF',CDF:'CDF'},ST={attente:'En attente',prep:'En préparation',exp:'Expédiée',livre:'Livrée',annule:'Annulée'},CONF=['prep','exp','livre'];
let mem={};const lg=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},ld=k=>{try{localStorage.removeItem(k)}catch(e){delete mem[k]}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),blank=()=>({clients:[],products:[],orders:[],expenses:[]});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),ago=n=>{const d=new Date(today());d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
let S={shop:'Ma boutique',cur:'XOF',cc:'225',thr:3};try{Object.assign(S,JSON.parse(lg('cfab_set')||'{}'))}catch(e){}
let mode=lg('cfab_mode')==='demo'?'demo':'real',D=load(),page='dash',per='month',q='',fs='',fp='',fd='';
function load(){try{return JSON.parse(lg('cfab_'+mode))||blank()}catch(e){return blank()}}
function save(){ls('cfab_'+mode,JSON.stringify(D));ls('cfab_set',JSON.stringify(S));ls('cfab_mode',mode)}
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' '+(LBL[S.cur]||S.cur),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0),P=id=>D.products.find(p=>p.id===id);
const sub=o=>sum(o.items,i=>i.qty*i.price),tot=o=>sub(o)+(+o.delivery||0),due=o=>Math.max(0,tot(o)-o.paid),cost=o=>sum(o.items,i=>i.qty*(i.cost||0));
const payS=o=>o.paid>=tot(o)?['Soldé','ok']:o.paid>0?['Partiel','wa']:['Impayé','ko'];
function inP(d,p){const t=today();if(p==='all')return true;if(p==='day')return d===t;if(p==='month')return d.slice(0,7)===t.slice(0,7);const x=new Date(t);x.setDate(x.getDate()-(x.getDay()+6)%7);return d>=x.toISOString().slice(0,10)&&d<=t}
function stats(fn){const os=D.orders.filter(o=>o.status!=='annule'&&fn(o.date)),sales=sum(os,tot),paid=sum(os,o=>Math.min(o.paid,tot(o))),cogs=sum(os,cost),ex=sum(D.expenses.filter(e=>fn(e.date)),e=>e.amount);return{n:os.length,sales,paid,debt:sum(os,due),cogs,ex,profit:sales-cogs-ex}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}function closeM(){$('#m').classList.remove('on')}
let askFn;function ask(msg,fn){askFn=fn;modal(`<h3>Confirmer</h3><p>${esc(msg)}</p><div class=row><button class=b2 onclick=closeM()>Annuler</button><button class="b" style="background:var(--r)" onclick="closeM();askFn()">Supprimer</button></div>`)}
const opts=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('');
const NAV=[['dash','🏠','Accueil'],['orders','🧾','Commandes'],['clients','👥','Clients'],['prod','📦','Produits'],['fin','💰','Finances'],['set','⚙️','Réglages']];
function go(p){page=p;q='';render();scrollTo(0,0)}
const chips=()=>`<div class=chips>${[['day','Aujourd’hui'],['week','Semaine'],['month','Mois'],['all','Tout']].map(([k,l])=>`<button class="chip${per===k?' on':''}" onclick="per='${k}';render()">${l}</button>`).join('')}</div>`;
const empty=(t,b)=>`<div class=empty>${t}${b?`<div class=row style="justify-content:center"><button class=b onclick="${b[1]}">${b[0]}</button></div>`:''}</div>`;
const kp=(l,v,c='')=>`<div class="card k ${c}"><small>${l}</small><b>${v}</b></div>`;
function render(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${page===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');$('#demo').innerHTML=mode==='demo'?'<div class=demo>Mode démo : données fictives. Elles sont séparées de vos vraies données.</div>':'';$('#app').innerHTML=({dash,orders,clients,prod,fin,set})[page]()}
function dash(){const s=stats(d=>inP(d,per)),low=D.products.filter(p=>p.stock<=S.thr);return`<h2>${esc(S.shop)} · CFA Business</h2>${chips()}<div class=grid>${kp('Ventes totales',fmt(s.sales),'big')}${kp('Commandes',s.n)}${kp('Paiements reçus',fmt(s.paid),'g')}${kp('Dettes clients',fmt(s.debt),'r')}${kp('Dépenses',fmt(s.ex))}${kp('Bénéfice estimé',fmt(s.profit),'g')}</div>
<div class=card><h3>Stock à surveiller</h3>${low.length?low.map(p=>`<div class=top><span>${esc(p.name)}</span><b class="${p.stock?'wa':'ko'}">${p.stock?'Reste '+p.stock:'Rupture'}</b></div>`).join(''):'<span class=mut>Aucun produit en alerte.</span>'}</div>
<p class=mut>Ventes = commandes non annulées. Paiements reçus = argent réellement encaissé. Bénéfice = ventes − coût des produits − dépenses.</p><button class=b style="width:100%" onclick="orderForm()">+ Nouvelle commande</button>`}
function orders(){let l=D.orders.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.num-a.num);const k=q.toLowerCase();if(k)l=l.filter(o=>o.cname.toLowerCase().includes(k)||o.cphone.includes(k));if(fs)l=l.filter(o=>o.status===fs);if(fd)l=l.filter(o=>o.date===fd);if(fp)l=l.filter(o=>o.status!=='annule'&&payS(o)[0]===fp);
return`<h2>Commandes</h2><input placeholder="Rechercher un nom ou un téléphone" value="${esc(q)}" oninput="q=this.value;rl()"><div class=row><select onchange="fs=this.value;render()"><option value="">Tous statuts</option>${opts(ST,fs)}</select><select onchange="fp=this.value;render()"><option value="">Tous paiements</option>${['Soldé','Partiel','Impayé'].map(x=>`<option${x===fp?' selected':''}>${x}</option>`).join('')}</select></div><div class=row><input type=date value="${fd}" onchange="fd=this.value;render()"><button class=b2 onclick="q=fs=fp=fd='';render()">Effacer</button></div><div class=row><button class=b onclick="orderForm()">+ Nouvelle commande</button></div><div id=ol style="margin-top:12px">${ol(l)}</div>`}
function rl(){let k=q.toLowerCase();$('#ol').innerHTML=ol(D.orders.filter(o=>(o.cname.toLowerCase().includes(k)||o.cphone.includes(k))&&(!fs||o.status===fs)&&(!fd||o.date===fd)&&(!fp||o.status!=='annule'&&payS(o)[0]===fp)).sort((a,b)=>b.date.localeCompare(a.date)))}
function ol(l){if(!l.length)return empty(D.orders.length?'Aucune commande ne correspond.':'Aucune commande pour le moment.',D.orders.length?0:['Ajouter une commande','orderForm()']);return l.map(o=>{const p=payS(o);return`<div class=card><div class=top><b>#${o.num} · ${esc(o.cname)}</b><b>${fmt(tot(o))}</b></div><div class=mut>${o.date} · ${esc(o.cphone)||'sans téléphone'}</div><div class=mut>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div><div style="margin-top:6px">${o.status==='annule'?'<span class="badge ko">Annulée</span>':`<span class="badge ${p[1]}">${p[0]}</span><span class=badge>Reste ${fmt(due(o))}</span>`}</div>
<select style="margin-top:8px" onchange="setSt('${o.id}',this.value)">${opts(ST,o.status)}</select><div class=acts><button class=bs onclick="orderForm('${o.id}')">Modifier</button><button class="bs w" onclick="msg(recap(D.orders.find(x=>x.id==='${o.id}')),'${esc(o.cphone)}')">Récap WhatsApp</button>${due(o)&&o.status!=='annule'?`<button class="bs w" onclick="remind('${o.cid}')">Rappel</button>`:''}<button class="bs d" onclick="delOrder('${o.id}')">Supprimer</button></div></div>`}).join('')}
const row=i=>`<div class=it><select onchange=pick(this)><option value="">Produit libre</option>${D.products.map(p=>`<option value="${p.id}"${p.id===i.pid?' selected':''}>${esc(p.name)} (${p.stock})</option>`).join('')}</select><input class=in placeholder="Nom du produit" value="${esc(i.name)}"><div class=r2><input class=iq type=number min=1 value="${i.qty}" oninput=calc()><input class=ip type=number min=0 placeholder="Prix" value="${i.price}" oninput=calc()><button class=x onclick="this.closest('.it').remove();calc()">×</button></div><input class=ic type=hidden value="${i.cost||0}"></div>`;
function orderForm(id){const o=id?D.orders.find(x=>x.id===id):null,it=o?o.items:[{name:'',qty:1,price:'',cost:0}];modal(`<h3>${o?'Modifier la commande #'+o.num:'Nouvelle commande'}</h3><div id=err class=err></div><label>Nom du client</label><input id=cn list=cl value="${esc(o?.cname)}" oninput="fillPh()"><datalist id=cl>${D.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><label>Téléphone</label><input id=cp type=tel value="${esc(o?.cphone)}"><label>Date</label><input id=od type=date value="${o?.date||today()}"><label>Statut</label><select id=os>${opts(ST,o?.status||'attente')}</select><label>Produits</label><div id=its>${it.map(row).join('')}</div><button class=b2 onclick="$('#its').insertAdjacentHTML('beforeend',row({name:'',qty:1,price:'',cost:0}))">+ Ajouter un produit</button><label>Frais de livraison</label><input id=dl type=number min=0 value="${o?.delivery||0}" oninput=calc()><label>Montant déjà payé</label><input id=pd type=number min=0 value="${o?.paid||0}" oninput=calc()><div class=tot id=tt></div><div class=row><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="saveOrder('${id||''}')">Enregistrer</button></div>`);calc()}
function fillPh(){const c=D.clients.find(c=>c.name.toLowerCase()===$('#cn').value.toLowerCase());if(c&&!$('#cp').value)$('#cp').value=c.phone}
function pick(s){const r=s.closest('.it'),p=P(s.value);if(p){r.querySelector('.in').value=p.name;r.querySelector('.ip').value=p.sell;r.querySelector('.ic').value=p.buy;calc()}}
function items(){return[...document.querySelectorAll('#its .it')].map(r=>({pid:r.querySelector('select').value,name:r.querySelector('.in').value.trim(),qty:+r.querySelector('.iq').value,price:+r.querySelector('.ip').value,cost:+r.querySelector('.ic').value||0}))}
function calc(){const t=sum(items(),i=>(i.qty||0)*(i.price||0))+(+$('#dl').value||0),p=+$('#pd').value||0;$('#tt').innerHTML=`Total : ${fmt(t)}<br><span class="${t>p?'ko':'ok'}">Reste à payer : ${fmt(Math.max(0,t-p))}</span>`}
function commit(o,its,st){const back={};if(o.deducted)o.items.forEach(i=>i.pid&&(back[i.pid]=(back[i.pid]||0)+i.qty));if(CONF.includes(st)){const need={};its.forEach(i=>i.pid&&(need[i.pid]=(need[i.pid]||0)+i.qty));for(const k in need){const p=P(k);if(p&&p.stock+(back[k]||0)<need[k])return'Stock insuffisant pour '+p.name+' ('+(p.stock+(back[k]||0))+' disponible)'}}
for(const k in back){const p=P(k);if(p)p.stock+=back[k]}o.items=its;o.status=st;o.deducted=false;if(CONF.includes(st)){its.forEach(i=>{const p=P(i.pid);if(p)p.stock-=i.qty});o.deducted=true}return''}
function saveOrder(id){const e=m=>{$('#err').textContent=m;$('#m').scrollTop=0},n=$('#cn').value.trim(),ph=$('#cp').value.trim(),its=items(),dl=+$('#dl').value||0,pd=+$('#pd').value||0,st=$('#os').value;
if(!n)return e('Indiquez le nom du client.');if(!its.length||its.some(i=>!i.name||!(i.qty>0)||!Number.isInteger(i.qty)||!(i.price>=0)||isNaN(i.price)))return e('Chaque produit doit avoir un nom, une quantité entière et un prix.');if(dl<0||pd<0)return e('Les montants ne peuvent pas être négatifs.');
const t=sum(its,i=>i.qty*i.price)+dl;if(pd>t)return e('Le montant payé dépasse le total ('+fmt(t)+').');
const o=id?D.orders.find(x=>x.id===id):{id:uid(),num:Math.max(0,...D.orders.map(x=>x.num))+1,items:[],deducted:false},er=commit(o,its,st);if(er)return e(er);
const c=cl(n,ph);Object.assign(o,{cid:c.id,cname:n,cphone:ph||c.phone,date:$('#od').value||today(),delivery:dl,paid:pd});if(!id)D.orders.push(o);save();closeM();toast('Commande enregistrée');render()}
function cl(n,ph){const d=ph.replace(/\D/g,'');let c=D.clients.find(c=>(d&&c.phone.replace(/\D/g,'')===d)||c.name.toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),name:n,phone:ph};D.clients.push(c)}else if(!c.phone&&ph)c.phone=ph;return c}
function setSt(id,st){const o=D.orders.find(x=>x.id===id),er=commit(o,o.items,st);if(er){toast(er);return render()}save();toast('Statut mis à jour');render()}
function delOrder(id){ask('Supprimer cette commande ? Le stock déduit sera remis.',()=>{const o=D.orders.find(x=>x.id===id);commit(o,[],'annule');D.orders=D.orders.filter(x=>x!==o);save();toast('Commande supprimée');render()})}
const cst=c=>{const os=D.orders.filter(o=>o.cid===c.id&&o.status!=='annule');return{os,tot:sum(os,tot),paid:sum(os,o=>Math.min(o.paid,tot(o))),due:sum(os,due)}};
function clients(){const k=q.toLowerCase(),l=D.clients.filter(c=>!k||c.name.toLowerCase().includes(k)||c.phone.includes(k));return`<h2>Clients</h2><input placeholder="Rechercher" value="${esc(q)}" oninput="q=this.value;render();this.focus()"><div class=row><button class=b onclick="clientForm()">+ Nouveau client</button></div><div style="margin-top:12px">${l.length?l.map(c=>{const s=cst(c);return`<div class=card onclick="clientView('${c.id}')"><div class=top><b>${esc(c.name)}</b><b class="${s.due?'ko':'ok'}">${s.due?'Doit '+fmt(s.due):'À jour'}</b></div><div class=mut>${esc(c.phone)||'sans téléphone'} · ${s.os.length} commande(s) · ${fmt(s.tot)}</div></div>`}).join(''):empty('Aucun client. Ils sont aussi créés automatiquement avec vos commandes.')}</div>`}
function clientForm(id){const c=id?D.clients.find(x=>x.id===id):{name:'',phone:''};modal(`<h3>${id?'Modifier':'Nouveau'} client</h3><div id=err class=err></div><label>Nom</label><input id=cn value="${esc(c.name)}"><label>Téléphone</label><input id=cp type=tel value="${esc(c.phone)}"><div class=row><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="saveClient('${id||''}')">Enregistrer</button></div>`)}
function saveClient(id){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n)return $('#err').textContent='Indiquez le nom du client.';if(id){const c=D.clients.find(x=>x.id===id);c.name=n;c.phone=p}else D.clients.push({id:uid(),name:n,phone:p});save();closeM();toast('Client enregistré');render()}
function clientView(id){const c=D.clients.find(x=>x.id===id),s=cst(c);modal(`<h3>${esc(c.name)}</h3><div class=mut>${esc(c.phone)||'sans téléphone'}</div><div class=grid style="margin-top:10px">${kp('Total achats',fmt(s.tot))}${kp('Payé',fmt(s.paid),'g')}${kp('Dettes',fmt(s.due),'r')}${kp('Commandes',s.os.length)}</div>${D.orders.filter(o=>o.cid===id).map(o=>`<div class=top><span>#${o.num} · ${o.date}</span><span>${fmt(tot(o))} <span class=badge>${ST[o.status]}</span></span></div>`).join('')||'<p class=mut>Pas encore de commande.</p>'}<div class=acts>${s.due?`<button class="bs w" onclick="remind('${id}')">Rappel de paiement</button>`:''}<button class=bs onclick="clientForm('${id}')">Modifier</button><button class="bs d" onclick="delClient('${id}')">Supprimer</button><button class=bs onclick=closeM()>Fermer</button></div>`)}
function delClient(id){if(D.orders.some(o=>o.cid===id))return toast('Ce client a des commandes : supprimez-les d’abord.');ask('Supprimer ce client ?',()=>{D.clients=D.clients.filter(c=>c.id!==id);save();render()})}
function prod(){const k=q.toLowerCase(),l=D.products.filter(p=>!k||p.name.toLowerCase().includes(k)||p.cat.toLowerCase().includes(k));return`<h2>Produits et stocks</h2><input placeholder="Rechercher un produit" value="${esc(q)}" oninput="q=this.value;render();this.focus()"><div class=row><button class=b onclick="prodForm()">+ Produit</button>${D.products.length?'<button class="b2" onclick="msg(catalog(),\'\')">Partager les prix</button>':''}</div><div style="margin-top:12px">${l.length?l.map(p=>{const m=p.sell-p.buy;return`<div class=card><div class=top><b>${esc(p.name)}</b><b class="${p.stock===0?'ko':p.stock<=S.thr?'wa':'ok'}">${p.stock===0?'Rupture':p.stock<=S.thr?'Stock faible : '+p.stock:'Stock : '+p.stock}</b></div><div class=mut>${esc(p.cat)}${p.desc?' · '+esc(p.desc):''}</div><div class=mut>Achat ${fmt(p.buy)} · Vente ${fmt(p.sell)}</div><div class=ok>Marge ${fmt(m)} (${p.sell?Math.round(m/p.sell*100):0} %)</div><div class=acts><button class=bs onclick="adj('${p.id}',-1)">−1</button><button class=bs onclick="adj('${p.id}',1)">+1</button><button class=bs onclick="prodForm('${p.id}')">Modifier</button><button class="bs d" onclick="delProd('${p.id}')">Supprimer</button></div></div>`}).join(''):empty('Aucun produit. Ajoutez-en pour suivre votre stock.',['Ajouter un produit','prodForm()'])}</div>`}
function adj(id,n){const p=P(id);p.stock=Math.max(0,p.stock+n);save();render()}
function prodForm(id){const p=id?P(id):{name:'',cat:'',desc:'',buy:'',sell:'',stock:''};modal(`<h3>${id?'Modifier':'Nouveau'} produit</h3><div id=err class=err></div><label>Nom</label><input id=pn value="${esc(p.name)}"><label>Catégorie</label><input id=pc list=cats value="${esc(p.cat)}"><datalist id=cats>${['Vêtements','Cosmétiques','Chaussures','Alimentaire','Accessoires'].map(x=>`<option>${x}`).join('')}</datalist><label>Description</label><input id=pdsc value="${esc(p.desc)}"><label>Prix d’achat</label><input id=pb type=number min=0 value="${p.buy}"><label>Prix de vente</label><input id=ps type=number min=0 value="${p.sell}"><label>Quantité disponible</label><input id=pq type=number min=0 value="${p.stock}"><div class=row><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="saveProd('${id||''}')">Enregistrer</button></div>`)}
function saveProd(id){const v={name:$('#pn').value.trim(),cat:$('#pc').value.trim()||'Autre',desc:$('#pdsc').value.trim(),buy:+$('#pb').value,sell:+$('#ps').value,stock:+$('#pq').value};if(!v.name)return $('#err').textContent='Indiquez le nom du produit.';if($('#pb').value===''||$('#ps').value===''||v.buy<0||v.sell<0)return $('#err').textContent='Indiquez un prix d’achat et un prix de vente valides.';if(!Number.isInteger(v.stock)||v.stock<0)return $('#err').textContent='La quantité doit être un nombre entier positif.';if(id)Object.assign(P(id),v);else D.products.push({id:uid(),...v});save();closeM();toast('Produit enregistré');render()}
function delProd(id){ask('Supprimer ce produit ? Les commandes existantes sont conservées.',()=>{D.products=D.products.filter(p=>p.id!==id);save();render()})}
function fin(){const s=stats(d=>inP(d,per)),days=[0,1,2,3,4,5,6].map(n=>ago(n)),t=today(),ms=[0,1,2,3,4,5].map(n=>{const d=new Date(t.slice(0,8)+'01');d.setMonth(d.getMonth()-n);return d.toISOString().slice(0,7)}),rw=(l,f)=>{const x=stats(f);return`<tr><td>${l}</td><td>${fmt(x.sales)}</td><td>${fmt(x.paid)}</td><td class=${x.profit<0?'ko':'ok'}>${fmt(x.profit)}</td></tr>`};
const ex=D.expenses.filter(e=>inP(e.date,per)).sort((a,b)=>b.date.localeCompare(a.date));
return`<h2>Finances</h2>${chips()}<div class=grid>${kp('Ventes',fmt(s.sales))}${kp('Encaissé',fmt(s.paid),'g')}${kp('Dettes clients',fmt(s.debt),'r')}${kp('Coût des produits vendus',fmt(s.cogs))}${kp('Dépenses',fmt(s.ex))}${kp('Bénéfice estimé',fmt(s.profit),'g')}</div>
<div class=card><h3>Dépenses</h3><button class=b onclick="expForm()">+ Dépense</button>${ex.length?ex.map(e=>`<div class=top style="margin-top:8px"><span>${e.date} · ${esc(e.label)}</span><span>${fmt(e.amount)} <button class="bs d" style="min-height:34px" onclick="delExp('${e.id}')">×</button></span></div>`).join(''):'<p class=mut>Aucune dépense sur cette période.</p>'}</div>
<div class="card sc"><h3>Par jour</h3><table><tr><th></th><th>Ventes</th><th>Reçu</th><th>Bénéf.</th></tr>${days.map(d=>rw(d.slice(5),x=>x===d)).join('')}</table></div><div class="card sc"><h3>Par mois</h3><table><tr><th></th><th>Ventes</th><th>Reçu</th><th>Bénéf.</th></tr>${ms.map(m=>rw(m,x=>x.slice(0,7)===m)).join('')}</table></div>
<p class=mut>Les paiements sont comptés à la date de la commande. Les commandes annulées sont exclues. Les frais de livraison sont inclus dans les ventes.</p>`}
function expForm(){modal(`<h3>Nouvelle dépense</h3><div id=err class=err></div><label>Description</label><input id=el placeholder="Transport, loyer, emballages…"><label>Montant</label><input id=ea type=number min=1><label>Date</label><input id=ed type=date value="${today()}"><div class=row><button class=b2 onclick=closeM()>Annuler</button><button class=b onclick="saveExp()">Enregistrer</button></div>`)}
function saveExp(){const l=$('#el').value.trim(),a=+$('#ea').value;if(!l)return $('#err').textContent='Décrivez la dépense.';if(!(a>0))return $('#err').textContent='Le montant doit être supérieur à 0.';D.expenses.push({id:uid(),label:l,amount:a,date:$('#ed').value||today()});save();closeM();toast('Dépense enregistrée');render()}
function delExp(id){ask('Supprimer cette dépense ?',()=>{D.expenses=D.expenses.filter(e=>e.id!==id);save();render()})}
const recap=o=>`*${S.shop}* · Commande n°${o.num}\nBonjour ${o.cname},\n${o.items.map(i=>`- ${i.name} ×${i.qty} : ${fmt(i.qty*i.price)}`).join('\n')}\nLivraison : ${fmt(o.delivery)}\n*Total : ${fmt(tot(o))}*\nDéjà payé : ${fmt(o.paid)}\n*Reste à payer : ${fmt(due(o))}*\nStatut : ${ST[o.status]}\nMerci pour votre confiance !`;
const catalog=()=>`*${S.shop}* · Nos produits\n`+D.products.map(p=>`- ${p.name} : ${fmt(p.sell)}${p.stock?'':' (rupture)'}`).join('\n');
function remind(cid){const c=D.clients.find(x=>x.id===cid),s=cst(c);msg(`Bonjour ${c.name}, petit rappel amical : il reste ${fmt(s.due)} à régler pour vos commandes chez ${S.shop}. Merci beaucoup !`,c.phone)}
function waUrl(){let d=($('#mp').value||'').replace(/\D/g,'');if(d[0]==='0')d=S.cc+d.slice(1);else if(d&&d.length<=9)d=S.cc+d;return'https://wa.me/'+d+'?text='+encodeURIComponent($('#mt').value)}
function msg(t,ph){modal(`<h3>Message prêt</h3><p class=mut>Rien n’est envoyé automatiquement : vous confirmez l’envoi dans WhatsApp.</p><label>Téléphone du client (avec ou sans indicatif)</label><input id=mp type=tel value="${esc(ph)}"><label>Message</label><textarea id=mt rows=9>${esc(t)}</textarea><div class=row><a class=b target=_blank rel=noopener onclick="this.href=waUrl()" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Ouvrir WhatsApp</a><button class=b2 onclick="copyT()">Copier</button></div>${navigator.share?'<div class=row><button class=b2 onclick="navigator.share({text:$(\'#mt\').value}).catch(()=>{})">Partager…</button></div>':''}<div class=row><button class=b2 onclick=closeM()>Fermer</button></div>`)}
function copyT(){const t=$('#mt');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});toast('Texte copié')}
const q2=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csv(k){const R={orders:[['N°','Date','Client','Téléphone','Statut','Produits','Total','Payé','Reste'],...D.orders.map(o=>[o.num,o.date,o.cname,o.cphone,ST[o.status],o.items.map(i=>i.name+' x'+i.qty).join(' | '),tot(o),o.paid,due(o)])],clients:[['Nom','Téléphone','Total achats','Payé','Dettes'],...D.clients.map(c=>{const s=cst(c);return[c.name,c.phone,s.tot,s.paid,s.due]})],products:[['Nom','Catégorie','Prix achat','Prix vente','Stock'],...D.products.map(p=>[p.name,p.cat,p.buy,p.sell,p.stock])],expenses:[['Date','Description','Montant'],...D.expenses.map(e=>[e.date,e.label,e.amount])]}[k],t=R.map(r=>r.map(q2).join(';')).join('\n');
modal(`<h3>Export CSV : ${k}</h3><p class=mut>Copiez le texte ou téléchargez le fichier, puis ouvrez-le dans Excel ou Google Sheets (séparateur « ; »).</p><textarea id=mt rows=8 readonly>${esc(t)}</textarea><div class=row><button class=b onclick="copyT()">Copier</button><a class=b2 download="cfa-${k}.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent('\ufeff'+t)}" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit">Télécharger</a></div><div class=row><button class=b2 onclick=closeM()>Fermer</button></div>`)}
function set(){return`<h2>Réglages</h2><div class=card><label>Nom de la boutique</label><input id=sn value="${esc(S.shop)}"><label>Devise</label><select id=sc>${Object.keys(LBL).map(c=>`<option${c===S.cur?' selected':''}>${c}</option>`).join('')}</select><label>Indicatif pays (WhatsApp)</label><input id=sk value="${S.cc}" inputmode=numeric><label>Alerte stock faible à partir de</label><input id=st type=number min=0 value="${S.thr}"><div class=row><button class=b onclick="saveSet()">Enregistrer</button></div></div>
<div class=card><h3>Données ${mode==='demo'?'de démo (fictives)':'réelles'}</h3>${mode==='demo'?'<p class=mut>Vous voyez des données fictives. Supprimez-les pour revenir à vos données réelles.</p><button class=b onclick="leaveDemo()">Supprimer la démo</button>':'<button class=b2 style="width:100%" onclick="startDemo()">Essayer avec des données de démo</button>'}</div>
<div class=card><h3>Exporter en CSV</h3><div class=acts>${[['orders','Commandes'],['clients','Clients'],['products','Produits'],['expenses','Dépenses']].map(([k,l])=>`<button class=bs onclick="csv('${k}')">${l}</button>`).join('')}</div></div>
${mode==='real'?'<button class="bs d" onclick="resetAll()">Effacer toutes mes données</button>':''}<p class=mut>Les données sont enregistrées uniquement dans ce navigateur, sur ce téléphone. Elles ne sont pas synchronisées entre appareils et ce n’est pas une sauvegarde sécurisée : exportez régulièrement en CSV. Vider les données du navigateur les efface.</p>`}
function saveSet(){S={shop:$('#sn').value.trim()||'Ma boutique',cur:$('#sc').value,cc:$('#sk').value.replace(/\D/g,'')||'225',thr:Math.max(0,+$('#st').value||0)};save();toast('Réglages enregistrés');render()}
function startDemo(){save();mode='demo';D=blank();seed();save();page='dash';toast('Mode démo activé');render()}
function leaveDemo(){ask('Supprimer les données de démo ?',()=>{ld('cfab_demo');mode='real';D=load();ls('cfab_mode','real');page='dash';toast('Démo supprimée');render()})}
function resetAll(){ask('Effacer TOUTES vos données ? Cette action est définitive.',()=>{D=blank();save();toast('Données effacées');render()})}
function seed(){[['Robe wax','Vêtements',8000,15000,12],['Beurre de karité','Cosmétiques',1500,3000,25],['Sandales cuir','Chaussures',5000,9000,6],['Sac à main','Accessoires',6000,12000,4]].forEach(([name,cat,buy,sell,stock])=>D.products.push({id:uid(),name,cat,desc:'',buy,sell,stock}));
let n=0;const mk=(nm,ph,d,l,dl,pd,st)=>{const o={id:uid(),num:++n,items:[],deducted:false},c=cl(nm,ph);commit(o,l.map(([i,qty])=>{const p=D.products[i];return{pid:p.id,name:p.name,qty,price:p.sell,cost:p.buy}}),st);Object.assign(o,{cid:c.id,cname:nm,cphone:ph,date:ago(d),delivery:dl,paid:pd});D.orders.push(o)};
mk('Awa Traoré','0701020304',0,[[0,2]],2000,32000,'livre');mk('Kofi Mensah','0505060708',1,[[1,5],[3,1]],1000,10000,'exp');mk('Fatou Diop','0102030405',3,[[2,2]],0,0,'prep');mk('Awa Traoré','0701020304',9,[[1,3]],0,9000,'livre');mk('Kofi Mensah','0505060708',2,[[0,1]],0,0,'annule');mk('Fatou Diop','0102030405',0,[[3,1]],1500,5000,'attente');
D.expenses.push({id:uid(),label:'Transport marchandises',amount:5000,date:ago(3)},{id:uid(),label:'Crédit téléphone',amount:2000,date:ago(1)})}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')closeM()});if(mode==='demo'&&!D.orders.length)seed();render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
